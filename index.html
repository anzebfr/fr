<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnzebFR | Streetwear Explosivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        creeper: { 500: '#00AA00', 400: '#55FF55', 900: '#003300' },
                        dark: { 900: '#0a0a0a', 800: '#141414', 700: '#222222', 600: '#333333' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], pixel: ['"Press Start 2P"', 'cursive'] }
                }
            }
        }
    </script>
    <style>
        /* Fondo con textura de matriz/bloques sutil */
        body { 
            background-color: #0a0a0a; 
            background-image: radial-gradient(#1f1f1f 2px, transparent 2px);
            background-size: 24px 24px;
            color: #ffffff; 
            padding-top: 80px; 
        }
        
        /* Efecto 3D para texto tipo Minecraft */
        .text-shadow-mc {
            text-shadow: 4px 4px 0px #003300;
        }

        /* Botones estilo Minecraft (Bloque 3D) */
        .btn-mc {
            background-color: #00AA00;
            color: #0a0a0a;
            border: 4px solid #55FF55;
            border-bottom-width: 8px;
            border-right-width: 8px;
            border-bottom-color: #003300;
            border-right-color: #003300;
            transition: all 0.1s ease-in-out;
            text-transform: uppercase;
        }
        .btn-mc:hover {
            background-color: #55FF55;
        }
        .btn-mc:active {
            /* Efecto de presionar el botón */
            border-bottom-width: 4px;
            border-right-width: 4px;
            transform: translate(4px, 4px);
        }

        /* Tarjetas de inventario/producto */
        .mc-card {
            background-color: #141414;
            border: 4px solid #333;
            border-top-color: #444;
            border-left-color: #444;
            border-bottom-color: #000;
            border-right-color: #000;
            padding: 12px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }
        .mc-card:hover {
            transform: translateY(-4px);
            border-color: #00AA00;
            border-top-color: #55FF55;
            border-left-color: #55FF55;
            border-bottom-color: #003300;
            border-right-color: #003300;
        }

        /* Imagen simulando slot de inventario */
        .mc-img-slot {
            background-color: #0a0a0a;
            border: 4px solid #000;
            border-bottom-color: #333;
            border-right-color: #333;
            width: 100%;
        }
        .product-img { 
            width: 100%; 
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
            object-position: center; 
        }

        /* Inputs de formulario estilo consola/letrero */
        .mc-input {
            background-color: #0a0a0a;
            border: 4px solid #333;
            border-top-color: #000;
            border-left-color: #000;
            border-bottom-color: #444;
            border-right-color: #444;
            color: white;
            padding: 16px;
            width: 100%;
            transition: border-color 0.2s;
        }
        .mc-input:focus {
            outline: none;
            border-color: #00AA00;
            border-top-color: #003300;
            border-left-color: #003300;
            border-bottom-color: #55FF55;
            border-right-color: #55FF55;
        }

        /* Scrollbar estilo Minecraft */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; border-left: 2px solid #333; }
        ::-webkit-scrollbar-thumb { background: #00AA00; border: 2px solid #55FF55; border-bottom-color: #003300; border-right-color: #003300; }
        ::-webkit-scrollbar-thumb:hover { background: #55FF55; }

        /* Etiqueta de rareza estilo Minecraft (NUEVO) */
        .mc-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            color: white;
            border: 3px solid;
            border-bottom-width: 6px;
            border-right-width: 6px;
            padding: 6px 8px;
            z-index: 20;
            transform: rotate(5deg);
            box-shadow: 4px 4px 0px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <header class="fixed top-0 left-0 right-0 border-b-4 border-dark-900 bg-dark-800 z-50 shadow-[0_4px_0_rgba(0,0,0,0.5)]">
        <div class="max-w-7xl mx-auto px-4 h-20 grid grid-cols-3 items-center">
            <nav class="flex gap-4 font-pixel text-[8px] md:text-[10px] uppercase text-white items-center">
                <a href="#inicio" target="_self" class="hover:text-creeper-400 transition drop-shadow-md">Inicio</a>
                <a href="#shop" target="_self" class="hover:text-creeper-400 transition drop-shadow-md">Colección</a>
                <a href="#contacto" target="_self" class="hover:text-creeper-400 transition drop-shadow-md text-creeper-500">MOB</a>
            </nav>
            <div class="flex justify-center items-center">
                <a href="#" target="_self" class="flex items-center group">
                    <span class="font-pixel text-lg md:text-xl text-white group-hover:text-gray-300 transition-colors text-shadow-mc">ANZEB</span>
                    <span class="font-pixel text-lg md:text-xl text-creeper-500 text-shadow-mc group-hover:text-creeper-400 transition-colors">FR</span>
                </a>
            </div>
            <div class="flex justify-end text-white items-center">
                <a href="dashboard.html" target="_self" class="hover:text-creeper-400 transition bg-dark-900 p-3 border-2 border-dark-600 rounded-sm">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <section id="inicio" class="py-32 border-b-8 border-dark-900 bg-gradient-to-b from-transparent to-dark-900/80 mt-12 relative">
        <div class="max-w-4xl mx-auto px-4 text-center relative z-10">
            <h1 class="font-pixel text-3xl md:text-5xl mb-6 text-white leading-tight text-shadow-mc">PELIGRO EN EL<br><span class="text-creeper-500">SERVIDOR</span></h1>
            <p class="font-pixel text-[10px] md:text-xs text-gray-300 mb-10 uppercase tracking-widest drop-shadow-md">Estética diseñada para sobrevivir</p>
            <a href="#shop" target="_self" class="inline-block btn-mc font-pixel text-[12px] px-10 py-5 uppercase tracking-tighter shadow-[6px_6px_0_rgba(0,0,0,0.8)]">
                Ver drop oficial
            </a>
        </div>
    </section>

    <main id="shop" class="max-w-4xl mx-auto px-4 py-24">
        <div class="flex flex-col items-center mb-16 text-center">
            <h2 class="font-pixel text-2xl text-white mb-6 text-shadow-mc">NUEVOS DROPS</h2>
            <div class="h-2 w-24 bg-creeper-500 border-2 border-creeper-900 mb-8"></div>
        </div>

        <!-- Grid restringido a 2 columnas para mantener la forma 2x2 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- 1: New White -->
            <div class="mc-card flex flex-col relative">
                <div class="mc-badge font-pixel text-[8px] md:text-[10px] uppercase bg-gray-500 border-gray-300 border-b-gray-700 border-r-gray-700">Común</div>
                <div class="mc-img-slot mb-4 overflow-hidden relative group">
                    <div class="absolute inset-0 bg-creeper-500/20 opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none"></div>
                    <img src="https://drive.google.com/thumbnail?id=1s2gTX8fyo7b1mYTlLa0Cy29ogQNl3s7j&sz=w600" class="product-img" alt="New White">
                </div>
                <div class="flex justify-between items-end mt-auto">
                    <h3 class="font-pixel text-[12px] md:text-[14px] text-white">New White</h3>
                    <p class="text-creeper-400 font-pixel text-[12px] md:text-[14px] drop-shadow-[1px_1px_0_#000]">$129.00</p>
                </div>
            </div>

            <!-- 2: Ice Peak -->
            <div class="mc-card flex flex-col relative">
                <div class="mc-badge font-pixel text-[8px] md:text-[10px] uppercase bg-blue-500 border-blue-300 border-b-blue-800 border-r-blue-800">Raro</div>
                <div class="mc-img-slot mb-4 overflow-hidden relative group">
                    <div class="absolute inset-0 bg-creeper-500/20 opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none"></div>
                    <img src="https://drive.google.com/thumbnail?id=1sYUVXEqpm6skUL0VYFShwG1dBO6D5VKy&sz=w600" class="product-img" alt="Ice Peak">
                </div>
                <div class="flex justify-between items-end mt-auto">
                    <h3 class="font-pixel text-[12px] md:text-[14px] text-white">Ice Peak</h3>
                    <p class="text-creeper-400 font-pixel text-[12px] md:text-[14px] drop-shadow-[1px_1px_0_#000]">$169.00</p>
                </div>
            </div>

            <!-- 3: Chain Out -->
            <div class="mc-card flex flex-col relative">
                <div class="mc-badge font-pixel text-[8px] md:text-[10px] uppercase bg-purple-600 border-purple-400 border-b-purple-900 border-r-purple-900">Épico</div>
                <div class="mc-img-slot mb-4 overflow-hidden relative group">
                    <div class="absolute inset-0 bg-creeper-500/20 opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none"></div>
                    <img src="https://drive.google.com/thumbnail?id=19J8A2iLGciv6W0ytdDlUPgv9WEvEeaUS&sz=w600" class="product-img" alt="Chain Out">
                </div>
                <div class="flex justify-between items-end mt-auto">
                    <h3 class="font-pixel text-[12px] md:text-[14px] text-white leading-tight">Chain Out</h3>
                    <p class="text-creeper-400 font-pixel text-[12px] md:text-[14px] drop-shadow-[1px_1px_0_#000]">$159.00</p>
                </div>
            </div>

            <!-- 4: Red Ghould -->
            <div class="mc-card flex flex-col relative">
                <div class="mc-badge font-pixel text-[8px] md:text-[10px] uppercase bg-yellow-500 border-yellow-200 border-b-yellow-700 border-r-yellow-700 text-black">Leyenda</div>
                <div class="mc-img-slot mb-4 overflow-hidden relative group">
                    <div class="absolute inset-0 bg-creeper-500/20 opacity-0 group-hover:opacity-100 transition-opacity z-10 pointer-events-none"></div>
                    <img src="https://drive.google.com/thumbnail?id=1VtUknj4XKKtja6qpHtOOI9cCp-TmU4qa&sz=w600" class="product-img" alt="Red Ghould">
                </div>
                <div class="flex justify-between items-end mt-auto">
                    <h3 class="font-pixel text-[12px] md:text-[14px] text-white leading-tight">Red Ghould</h3>
                    <p class="text-creeper-400 font-pixel text-[12px] md:text-[14px] drop-shadow-[1px_1px_0_#000]">$199.00</p>
                </div>
            </div>

        </div>
    </main>

    <section id="contacto" class="bg-dark-800 py-24 border-t-8 border-dark-900 shadow-[inset_0_10px_20px_rgba(0,0,0,0.5)]">
        <div class="max-w-xl mx-auto px-4 text-center">
            <div class="bg-dark-900 border-4 border-dark-700 p-8 shadow-[8px_8px_0_rgba(0,0,0,0.8)]">
                <h2 class="font-pixel text-xl mb-8 drop-shadow-[2px_2px_0_#000]">ÚNETE A LA MOB</h2>
                <form id="subscribeForm" class="space-y-6">
                    <input type="text" id="name" placeholder="Gamertag" required class="mc-input font-pixel text-[10px]">
                    <input type="email" id="email" placeholder="Correo electrónico" required class="mc-input font-pixel text-[10px]">
                    <input type="text" id="size" placeholder="Talla (S, M, L, XL)" required class="mc-input font-pixel text-[10px]">
                    <button type="submit" id="submitBtn" class="w-full btn-mc font-pixel text-[12px] py-5 mt-4">
                        Enviar solicitud
                    </button>
                </form>
                <p id="msg" class="mt-6 font-pixel text-[10px] drop-shadow-[1px_1px_0_#000] h-4"></p>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxTVh7tKU0Wx22VA6T6y98L2Kk0bMMELk",
            authDomain: "laging-page-ahora-si.firebaseapp.com",
            projectId: "laging-page-ahora-si",
            storageBucket: "laging-page-ahora-si.firebasestorage.app",
            messagingSenderId: "95640388789",
            appId: "1:95640388789:web:1cf1430f3fe6698c436afc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('subscribeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const form = document.getElementById('subscribeForm');
            
            // Mostrar mensaje de éxito instantáneamente
            msg.innerText = "¡GRACIAS POR TU INTERÉS!";
            msg.className = "mt-6 font-pixel text-[10px] text-creeper-400 drop-shadow-[1px_1px_0_#000] h-4";
            
            try {
                // Guardar en segundo plano sin hacer esperar al usuario
                await addDoc(collection(db, 'subscribers'), {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    size: document.getElementById('size').value,
                    timestamp: new Date().toISOString()
                });
                form.reset();
            } catch (error) {
                // Si falla (ej. sin internet), actualiza el mensaje
                msg.innerText = "ERROR DE CONEXIÓN AL SERVIDOR";
                msg.className = "mt-6 font-pixel text-[10px] text-red-500 drop-shadow-[1px_1px_0_#000] h-4";
            }
        });
    </script>
</body>
</html>
